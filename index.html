<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruth's Car Pool</title>
<meta name="description" content="Carpool schedule, routes, reminders and billing for Ruth's Car Pool">
<meta name="theme-color" content="#f2a900">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruth's Car Pool">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <h1 id="poolName">Ruth's Car Pool</h1>
  </div>
</header>
<div class="stripe" aria-hidden="true"></div>

<div id="live" hidden></div>
<main id="view"></main>

<nav class="tabs" id="tabs">
  <button data-tab="today" class="active"><span data-ic="calendar"></span>Schedule</button>
  <button data-tab="riders"><span data-ic="users"></span>Riders</button>
  <button data-tab="routes"><span data-ic="route"></span>Routes</button>
  <button data-tab="billing"><span data-ic="receipt"></span>Billing</button>
  <button data-tab="settings"><span data-ic="settings"></span>Settings</button>
</nav>

<dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
<div id="toast" role="status"></div>

<script src="live.js"></script>
<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="app.js"></script>
</body>
</html>
